# Lint, tests, coverage, security scans and a Windows build on every pull
# request and push to main. Actions are pinned by commit SHA (the tag is in
# the comment); permissions are read-only unless a job says otherwise.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '22'

jobs:
  lint-frontend:
    name: Lint (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # oxlint/oxfmt are this codebase's eslint/prettier.
      - name: oxlint
        run: npx oxlint --type-aware --deny-warnings .
      - name: oxfmt --check
        run: npm run format:check
      - name: tsc --noEmit
        run: npm run typecheck

  lint-rust:
    name: Lint (Rust, Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          key: lint
      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --all --check
      - name: cargo clippy (release features)
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: cargo clippy (dev features)
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets --features dev -- -D warnings

  test-rust-windows:
    name: Tests (Rust, Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          key: test
      - name: cargo test --workspace
        working-directory: src-tauri
        run: cargo test --locked --workspace

  test-rust-linux:
    name: Tests + coverage (Rust domain, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          key: linux
      - name: System libraries for the keyring backend
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: cargo-llvm-cov
      # The domain crates build without the iRacing SDK (kerb is Windows-only).
      - name: Tests with coverage gate (domain logic >= 70 % lines)
        working-directory: src-tauri
        run: >-
          cargo llvm-cov --locked
          -p mt-reflaps -p mt-computations -p mt-model
          --fail-under-lines 70
          --lcov --output-path lcov.info
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage
          path: src-tauri/lcov.info

  test-frontend:
    name: Tests + coverage (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Vitest
        run: npm test
      # Stores written or changed for the merged features hold 70 % lines;
      # every other store is held where it is today (60 %) so it cannot slide.
      - name: Coverage gate (new and changed stores >= 70 %)
        run: >-
          npx vitest run --coverage --coverage.provider=v8
          --coverage.include='src/features/reference-laps/*.store.ts'
          --coverage.include='src/widgets/brake-point/*.store.ts'
          --coverage.include='src/widgets/input-trace/*.store.ts'
          --coverage.include='src/entities/brake-cue/*.ts'
          --coverage.thresholds.lines=70
          --coverage.reporter=text-summary
      - name: Coverage ratchet (all stores >= 60 %)
        run: >-
          npx vitest run --coverage --coverage.provider=v8
          --coverage.include='src/**/*.store.ts'
          --coverage.thresholds.lines=60
          --coverage.reporter=text-summary

  fuzz:
    name: Fuzz (parsers, 60 s each)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: cargo-fuzz
      - name: cargo fuzz
        working-directory: src-tauri/crates/mt-reflaps
        run: |
          for target in garage61_csv garage61_json brake_cue; do
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$target" -- -max_total_time=60 -rss_limit_mb=2048
          done
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: src-tauri/crates/mt-reflaps/fuzz/artifacts

  security:
    name: Security (SCA, secrets, SAST, Tauri config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Tauri security configuration
        run: npm run check:tauri-config
      - name: npm audit (production, high+)
        run: npm audit --audit-level=high --omit=dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: cargo-audit,cargo-deny
      - name: cargo deny check (advisories, licenses, bans, sources)
        working-directory: src-tauri
        run: cargo deny --locked check
      - name: cargo audit
        working-directory: src-tauri
        # The same ignores as deny.toml, each with its reason there.
        run: >-
          cargo audit
          --ignore RUSTSEC-2024-0370 --ignore RUSTSEC-2024-0449
          --ignore RUSTSEC-2026-0370 --ignore RUSTSEC-2026-0371
          --ignore RUSTSEC-2026-0372 --ignore RUSTSEC-2024-0429
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
      - name: gitleaks (full history)
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.28.0
          "$(go env GOPATH)/bin/gitleaks" git . --redact --no-banner --config .gitleaks.toml
      - name: OSV-Scanner (lock files)
        run: |
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.2.2
          "$(go env GOPATH)/bin/osv-scanner" scan source --config osv-scanner.toml \
            --lockfile package-lock.json --lockfile src-tauri/Cargo.lock
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Semgrep (p/rust, p/typescript, p/react, p/secrets)
        run: |
          python -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/pip" install --quiet semgrep==1.185.0
          "$RUNNER_TEMP/semgrep/bin/semgrep" scan --metrics=off --error --severity ERROR --severity WARNING \
            --config p/rust --config p/typescript --config p/react --config p/secrets \
            src src-tauri/src src-tauri/crates

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      # Code scanning uploads need GitHub Advanced Security on a private
      # repository, so the SARIF is kept as an artifact and judged here.
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          category: /language:${{ matrix.language }}
          upload: never
          output: codeql-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-${{ matrix.language }}
          path: codeql-results
      - name: Fail on error- or warning-level findings
        run: |
          count=$(jq '[.runs[].results[] | select((.level // "warning") == "error" or (.level // "warning") == "warning")] | length' codeql-results/*.sarif)
          jq -r '.runs[].results[] | "\(.level // "warning") \(.ruleId) \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine) \(.message.text)"' codeql-results/*.sarif
          [ "$count" -eq 0 ] || { echo "::error::CodeQL found $count issue(s)"; exit 1; }

  build:
    name: Build (Windows installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          key: build
      # No updater key on pull requests: the bundle is built unsigned.
      - name: tauri build (NSIS)
        shell: bash
        run: >-
          npx tauri build --ci
          --config '{"bundle":{"createUpdaterArtifacts":false}}'
          -- --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-app-exe
          # mainBinaryName renames the exe; either name is accepted.
          path: |
            src-tauri/target/release/trailbrake.exe
            src-tauri/target/release/marble-trace.exe
          if-no-files-found: error

  e2e:
    name: E2E (Windows, WebView2 CDP)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          key: build
      # wry always hands WebView2 its own AdditionalBrowserArguments, so the
      # DevTools port cannot come from the environment: a test build adds it to
      # the main window's arguments (wry's defaults kept). The release exe is
      # not changed.
      - name: Build the e2e variant (DevTools port on the main window)
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const conf = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
            const windows = conf.app.windows.map((window, index) => index === 0
              ? { ...window, additionalBrowserArgs: "--disable-features=msWebOOUI,msPdfOOUI,msSmartScreenProtection --remote-debugging-port=9333" }
              : window);
            fs.writeFileSync(process.env.RUNNER_TEMP + "/tauri.e2e.json", JSON.stringify({ app: { windows } }));
          '
          npx tauri build --ci --no-bundle --config "$RUNNER_TEMP/tauri.e2e.json" -- --locked
      - name: Install the e2e runner
        working-directory: e2e
        run: npm ci --ignore-scripts
      - name: Smoke test the e2e exe
        working-directory: e2e
        shell: bash
        run: |
          app="$GITHUB_WORKSPACE/src-tauri/target/release/trailbrake.exe"
          [ -f "$app" ] || app="$GITHUB_WORKSPACE/src-tauri/target/release/marble-trace.exe"
          APP_PATH="$app" npm test
      - name: App logs on failure
        if: failure()
        shell: pwsh
        run: |
          foreach ($root in @($env:APPDATA, $env:LOCALAPPDATA)) {
            Get-ChildItem (Join-Path $root 'io.github.halkatolstaya.trailbrake') -Recurse -Filter *.log -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Output "--- $($_.FullName)"; Get-Content $_.FullName -Tail 80 }
          }
