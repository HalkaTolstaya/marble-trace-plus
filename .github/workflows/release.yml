# Builds and publishes a release for a `v*` tag on main: the NSIS installer,
# its updater signature and latest.json, CycloneDX SBOMs, SHA-256 sums and a
# build provenance attestation. Nothing is deployed anywhere else.
#
# Secrets (repository settings → Secrets and variables → Actions):
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#     minisign key for the updater; its public half is in tauri.conf.json.
#     Without them the installer is still released, but no latest.json, so
#     installed copies are not offered the update.
#   WINDOWS_CERTIFICATE (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD
#     optional Authenticode certificate; without it SmartScreen warns.
name: Release

on:
  push:
    tags: ['v*']
  # Run from main to release the version in package.json: the workflow creates
  # the tag itself (for environments that cannot push tags).
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '22'

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: The commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Versions agree and the changelog has the entry
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::dispatch only from main"; exit 1; }
            version=$(node -p "require('./package.json').version")
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
              echo "::error::v$version is already tagged"; exit 1
            fi
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          package=$(node -p "require('./package.json').version")
          tauri=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          for found in "$package" "$tauri" "$cargo"; do
            if [ "$found" != "$version" ]; then
              echo "::error::tag $version does not match $package / $tauri / $cargo"
              exit 1
            fi
          done
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no [$version]"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: verify
    uses: ./.github/workflows/ci.yml
    # A called workflow gets at most these; CodeQL there reads the run.
    permissions:
      contents: read
      actions: read
      security-events: write

  release:
    name: Build, sign and publish
    needs: [verify, ci]
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Updater signing key present?
        id: keys
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CERT: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          echo "updater=$([ -n "$KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "codesign=$([ -n "$CERT" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ -n "$KEY" ] || echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set: releasing without updater artifacts."
          [ -n "$CERT" ] || echo "::warning::No Windows code-signing certificate: the installer is unsigned and SmartScreen will warn."

      # Authenticode stub: imports the certificate when the secret exists and
      # hands its thumbprint to the bundler.
      - name: Import code-signing certificate
        id: cert
        if: steps.keys.outputs.codesign == 'true'
        shell: pwsh
        env:
          CERT: ${{ secrets.WINDOWS_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $bytes = [Convert]::FromBase64String($env:CERT)
          $path = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($path, $bytes)
          $secure = ConvertTo-SecureString $env:CERT_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          Remove-Item $path
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: tauri build (NSIS)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER: ${{ steps.keys.outputs.updater }}
          THUMBPRINT: ${{ steps.cert.outputs.thumbprint }}
        run: |
          config='{"bundle":{"createUpdaterArtifacts":'"$UPDATER"'}}'
          if [ -n "$THUMBPRINT" ]; then
            config='{"bundle":{"createUpdaterArtifacts":'"$UPDATER"',"windows":{"certificateThumbprint":"'"$THUMBPRINT"'","digestAlgorithm":"sha256","timestampUrl":"http://timestamp.digicert.com"}}}'
          fi
          npx tauri build --ci --config "$config" -- --locked

      # Not dist/: that is the frontend build tauri bundles.
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p release-out
          installer=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          cp "$installer" "release-out/trailbrake_${VERSION}_x64-setup.exe"
          if [ -f "$installer.sig" ]; then
            cp "$installer.sig" "release-out/trailbrake_${VERSION}_x64-setup.exe.sig"
          fi

      - name: SBOM (CycloneDX, Rust + npm)
        shell: bash
        run: |
          cargo install --locked cargo-cyclonedx@0.5.7
          (cd src-tauri && cargo cyclonedx --format json --override-filename sbom)
          cp src-tauri/sbom.json "release-out/sbom-rust.cdx.json"
          npx --yes @cyclonedx/cyclonedx-npm@4.0.2 --omit dev --output-format JSON --output-file release-out/sbom-npm.cdx.json

      - name: latest.json for the updater
        if: steps.keys.outputs.updater == 'true'
        shell: bash
        env:
          REPO: ${{ github.repository }}
        run: |
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            const file = `trailbrake_${v}_x64-setup.exe`;
            const notes = (fs.readFileSync("CHANGELOG.md", "utf8").split(/^## \[/m)
              .find((s) => s.startsWith(v + "]")) || "").split("\n").slice(1).join("\n").trim();
            fs.writeFileSync("release-out/latest.json", JSON.stringify({
              version: v,
              notes,
              pub_date: new Date().toISOString(),
              platforms: { "windows-x86_64": {
                signature: fs.readFileSync(`release-out/${file}.sig`, "utf8"),
                url: `https://github.com/${process.env.REPO}/releases/download/v${v}/${file}`,
              } },
            }, null, 2));
          '

      - name: Release notes
        shell: bash
        run: |
          mkdir -p notes
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            const section = (fs.readFileSync("CHANGELOG.md", "utf8").split(/^## \[/m)
              .find((s) => s.startsWith(v + "]")) || "").split("\n").slice(1).join("\n").trim();
            fs.writeFileSync("notes/RELEASE_NOTES.md", [
              section,
              "",
              "### Install",
              "",
              "Download `trailbrake_" + v + "_x64-setup.exe` and run it. Until the installer is code-signed, Windows SmartScreen shows *Windows protected your PC*: choose **More info → Run anyway**. Verify the download against `SHA256SUMS.txt`.",
            ].join("\n"));
          '

      - name: SHA-256 sums
        shell: bash
        working-directory: release-out
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      # Attestations need a public repository (or GitHub Enterprise Cloud).
      - name: Build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-out/*.exe

      - name: Publish the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: Trailbrake ${{ env.VERSION }}
          # Creates the tag on this commit when the run was dispatched.
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: notes/RELEASE_NOTES.md
          files: release-out/*
          fail_on_unmatched_files: true
